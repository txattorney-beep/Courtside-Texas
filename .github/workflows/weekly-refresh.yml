name: Weekly court and rules refresh
on:
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches: [main]
    paths: ['data/refresh-request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: courtside-main-workflows
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install public document tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - uses: actions/cache@v4
        with:
          path: work
          key: courtside-sources-${{ github.run_id }}
          restore-keys: courtside-sources-
      - name: Refresh official court, rule and agency sources
        run: python3 scripts/refresh.py
      - name: Validate and build the public site
        run: |
          node --check public/app.js
          python3 scripts/build.py
          python3 scripts/validate.py
      - name: Publish verified snapshot to GitHub
        run: |
          rm -rf site
          cp -a dist site
          git config user.name 'Courtside Texas updates'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data data site
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official court and rule sources"
            git push
          fi
      - name: Notify participating search engines
        run: python3 scripts/submit_indexnow.py
