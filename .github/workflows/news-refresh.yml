name: Twice-daily legal news refresh
on:
  schedule:
    # Local Central time, including DST. Catch-up checks only refresh a missed window.
    - cron: '30 7,16 * * *'
      timezone: America/Chicago
    - cron: '50 7,16 * * *'
      timezone: America/Chicago
    - cron: '10 8,17 * * *'
      timezone: America/Chicago
  push:
    branches: [main]
    paths: ['scripts/refresh_news.py', 'scripts/news_health.py', '.github/workflows/news-refresh.yml', 'public/data/news-seed.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: courtside-main-workflows
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether the Central-time edition is due
        id: due
        run: python3 scripts/news_health.py gate
      - name: Refresh current legal headlines
        if: steps.due.outputs.refresh == 'true'
        run: python3 scripts/refresh_news.py
      - name: Build and validate
        run: |
          node --check public/news.js
          python3 scripts/build.py
          python3 scripts/validate.py
          node --test tests/search.test.cjs
      - name: Publish news edition
        if: steps.due.outputs.refresh == 'true'
        run: |
          rm -rf site
          cp -a dist site
          git config user.name 'Courtside Texas news'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/news.json site
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Texas and Fifth Circuit legal headlines"
            git pull --rebase origin main
            git push
          fi
      - name: Verify actual public headlines and timestamp
        run: python3 scripts/news_health.py
      - name: Notify search engines
        run: python3 scripts/submit_indexnow.py --news-only
